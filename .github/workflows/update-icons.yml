name: Update cloud icons

on:
  schedule:
    - cron: '0 6 1 1,7 *'
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Limit to one cloud (blank = all)'
        required: false
        type: choice
        options: ['', aws, gcp, azure]

permissions:
  contents: read

concurrency:
  group: update-icons
  cancel-in-progress: false

jobs:
  refresh:
    name: Fetch icons and open a PR on drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.Js {{matrix.node}}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Download the latest icon sets
        id: fetch
        env:
          CLOUD: ${{ inputs.cloud }}
        run: |
          args=""
          case "$CLOUD" in
            aws|gcp|azure) args="--cloud $CLOUD" ;;
            "") ;;
            *) echo "Unsupported cloud: $CLOUD" >&2; exit 1 ;;
          esac
          node scripts/fetch-icons.mjs $args | tee icon-update.log

      - name: Scan the downloaded assets for active content
        run: node scripts/scan-svg-assets.mjs

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- assets/icons; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream icon changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "added=$(git diff --numstat -- assets/icons | wc -l | tr -d ' ')"
            } >> "$GITHUB_OUTPUT"
            git diff --stat -- assets/icons | tail -1
          fi

      - name: Build the pull request body
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo "The semiannual icon refresh found upstream changes."
            echo
            echo '```'
            cat icon-update.log
            echo '```'
            echo
            echo "### Review checklist"
            echo
            echo "- [ ] \`npm run icons:check\` passes"
            echo "- [ ] Newly added services worth mapping in \`src/providers/*/index.js\`"
            echo "- [ ] Retired icons are not referenced anywhere"
            echo
            echo "These assets stay under their vendors' terms — see \`assets/icons/NOTICE.md\`."
            echo "Generated by \`.github/workflows/update-icons.yml\`."
          } > pr-body.md

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/icon-refresh
          base: main
          title: 'chore(icons): refresh cloud architecture icon sets'
          body-path: pr-body.md
          commit-message: |
            chore(icons): refresh cloud architecture icon sets

            Semiannual automated refresh from the sources in
            scripts/icons/sources.json. Vendor assets remain under their own
            terms; see assets/icons/NOTICE.md.
          labels: |
            icons
            automated
          add-paths: assets/icons
          delete-branch: true
