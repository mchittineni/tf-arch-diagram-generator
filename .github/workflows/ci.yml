name: CI Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify embedded icons match the official assets
        run: npm run icons:build:check

      - name: Build web app
        run: npm run build

      - name: Run tests with the coverage gate
        run: npm run test:coverage

      - name: Render every example plan
        run: |
          mkdir -p out
          for plan in examples/*.plan.json; do
            node bin/cli.js render "$plan" --out "out/$(basename "$plan" .plan.json).svg"
          done

      - name: Verify the package contents
        run: npm pack --dry-run

      - name: Upload rendered diagrams
        if: matrix.node == 24
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-diagrams
          path: out/*.svg

  python:
    name: Python package (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app (bundled into the wheel)
        run: npm run build

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build python/ --outdir python/dist
          python -m twine check --strict python/dist/*

      - name: Install the wheel
        run: python -m pip install python/dist/*.whl

      - name: Smoke-test the console script
        run: |
          mkdir -p out
          test "$(tf-arch --version)" = "$(node -p "require('./package.json').version")"
          tf-arch render examples/multi-cloud.plan.json --out out/python-multi-cloud.svg
          tf-arch inspect examples/aws-eks.plan.json --json > /dev/null

      - name: Run the Python test suite against the installed wheel
        run: python -m unittest discover -s python/tests -t python/tests -v
