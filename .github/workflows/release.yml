name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.Js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Test
        run: npm test

      - name: Render example diagrams for the release
        run: |
          mkdir -p release-artifacts
          for plan in examples/*.plan.json; do
            node bin/cli.js render "$plan" --out "release-artifacts/$(basename "$plan" .plan.json).svg"
          done

      - name: Preflight npm token check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          len=${#NPM_TOKEN}
          echo "token length: $len"
          case "$NPM_TOKEN" in
            npm_*) echo "token prefix: npm_ (expected granular/automation format)" ;;
            "")    echo "token prefix: EMPTY — secret is not reaching the job" ;;
            *)     echo "token prefix: NOT npm_ — unexpected token format" ;;
          esac
          stripped=$(printf '%s' "$NPM_TOKEN" | tr -d '[:space:]')
          if [ "${#stripped}" -ne "$len" ]; then
            echo "whitespace: token CONTAINS whitespace/newline — re-set the secret"
          else
            echo "whitespace: none"
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $NPM_TOKEN" https://registry.npmjs.org/-/whoami)
          echo "registry whoami HTTP status: $code"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx semantic-release
